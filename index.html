<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>One Little Question 💕</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Poppins", system-ui, -apple-system;
}

body {
  margin: 0;
  height: 100vh;
  background: linear-gradient(135deg, #ff9a9e, #fad0c4);
  overflow: hidden;
  display: flex;
  justify-content: center;
  align-items: center;
}

.container {
  text-align: center;
  padding: 20px;
  max-width: 380px;
  width: 100%;
  z-index: 2;
}

/* MAIN QUESTION – DOMINATING */
h1 {
  color: #ffffff;
  font-size: 2.6rem;
  font-weight: 800;
  margin-bottom: 14px;
  text-shadow: 0 6px 18px rgba(0,0,0,0.25);
}

/* WARNING TEXT */
.warning {
  display: none;
  margin: 12px 0 22px;
  font-size: 1.2rem;
  font-weight: 700;
  color: #fff;
  text-shadow: 0 4px 14px rgba(0,0,0,0.35);
  animation: shake 0.4s ease;
}

@keyframes shake {
  0% { transform: translateX(0); }
  25% { transform: translateX(-6px); }
  50% { transform: translateX(6px); }
  75% { transform: translateX(-6px); }
  100% { transform: translateX(0); }
}

.buttons {
  position: relative;
  height: 260px;
}

button {
  position: absolute;
  padding: 16px 34px;
  font-size: 19px;
  border-radius: 18px;
  border: none;
  cursor: pointer;
  transition: transform 0.15s ease;
}

/* YES */
#yes {
  background: #2ecc71;
  color: white;
  left: 50%;
  bottom: 10px;
  transform: translateX(-50%);
  animation: pulse 1.5s infinite;
}

@keyframes pulse {
  0% { transform: translateX(-50%) scale(1); }
  50% { transform: translateX(-50%) scale(1.1); }
  100% { transform: translateX(-50%) scale(1); }
}

/* NO – UNTOUCHABLE */
#no {
  background: #e74c3c;
  color: white;
  top: 20px;
  left: 20px;
  pointer-events: none;
}

/* Floating hearts */
.heart {
  position: absolute;
  color: rgba(255,255,255,0.7);
  animation: floatUp 6s linear forwards;
}

@keyframes floatUp {
  from {
    transform: translateY(100vh) scale(0.6);
    opacity: 0;
  }
  30% { opacity: 1; }
  to {
    transform: translateY(-10vh) scale(1.2);
    opacity: 0;
  }
}
</style>
</head>

<body>

<div class="container">
  <h1>Lets go for morning walk? 💖</h1>
  <div class="warning" id="warning"></div>

  <div class="buttons" id="arena">
    <button id="yes">Yes 😍</button>
    <button id="no">No 🙃</button>
  </div>
</div>

<script>
const noBtn = document.getElementById("no");
const arena = document.getElementById("arena");
const yesBtn = document.getElementById("yes");
const warning = document.getElementById("warning");

let attempts = 0;
const showWarningAfter = 3;

const warnings = [
  "Hey 😅 stop trying",
  "You’re testing destiny 👀",
  "This is not possible🤨",
  "No is not an option 💀",
  "Just say YES madamji 💖"
];

function moveNo() {
  const a = arena.getBoundingClientRect();
  const b = noBtn.getBoundingClientRect();

  const x = Math.random() * (a.width - b.width);
  const y = Math.random() * (a.height - b.height);

  noBtn.style.left = x + "px";
  noBtn.style.top = y + "px";

  attempts++;

  if (attempts >= showWarningAfter) {
    warning.style.display = "block";
    warning.textContent =
      warnings[Math.min(attempts - showWarningAfter, warnings.length - 1)];
    warning.style.animation = "none";
    warning.offsetHeight; // reset animation
    warning.style.animation = "shake 0.4s ease";
  }

  if (navigator.vibrate) navigator.vibrate(40);
}

/* PROXIMITY DETECTION */
document.addEventListener("mousemove", e => {
  const rect = noBtn.getBoundingClientRect();
  const dx = e.clientX - (rect.left + rect.width / 2);
  const dy = e.clientY - (rect.top + rect.height / 2);
  const distance = Math.sqrt(dx * dx + dy * dy);

  if (distance < 110) moveNo();
});

/* Mobile */
document.addEventListener("touchmove", moveNo);

/* YES CLICK */
yesBtn.addEventListener("click", () => {
  document.body.innerHTML = `
    <div style="
      height:100vh;
      display:flex;
      justify-content:center;
      align-items:center;
      background:linear-gradient(135deg,#ff758c,#ff7eb3);
      color:white;
      text-align:center;
      padding:20px;">
      <h1 style="font-size:2.4rem;">
        Thanks for being a cutie!<br><br>You chose wisely 😌💖<br><br>
        Morning walk confirmed 🌅🤍
      </h1>
    </div>
  `;
});

/* Floating hearts */
setInterval(() => {
  const heart = document.createElement("div");
  heart.className = "heart";
  heart.innerHTML = "❤";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = Math.random() * 18 + 16 + "px";
  document.body.appendChild(heart);
  setTimeout(() => heart.remove(), 6000);
}, 350);
</script>

</body>
</html>
